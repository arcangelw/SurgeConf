{% extends "base.html" %}
{% import "macros/rule_modals.html" as m with context %}
{% block content %}
<div class="page-header">
  <h1>{{ t["profile.title"] }}</h1>
  <button class="btn btn-primary" onclick="showAddProfile()">{{ t["profile.new"] }}</button>
</div>

<div class="card" style="margin-bottom:16px;">
  <p style="font-size:13px;color:var(--text2);">{{ t["profile.hint"] }}</p>
</div>

<div id="profile-list"></div>

<div class="modal-overlay" id="profile-modal">
  <div class="modal" style="max-width:640px;">
    <h3 id="profile-modal-title">{{ t["profile.new"] }}</h3>
    <input type="hidden" id="profile-edit-id">
    <div class="form-group">
      <label>{{ t["profile.name"] }}</label>
      <input type="text" id="profile-name" placeholder="例：流媒体优化">
    </div>
    <div class="form-group">
      <label>{{ t["profile.desc"] }}</label>
      <input type="text" id="profile-desc" placeholder="{{ t["profile.desc"] }}">
    </div>
    <div style="display:flex;gap:16px;">
      <div class="form-group" style="flex:1;">
        <label>{{ t["profile.locale_label"] }}</label>
        <select id="profile-locale">
          <option value="zh">{{ t["profile.locale_zh"] }}</option>
          <option value="en">{{ t["profile.locale_en"] }}</option>
        </select>
      </div>
      <div class="form-group">
        <label class="checkbox" style="margin-top:28px;">
          <input type="checkbox" id="profile-default"> {{ t["profile.set_default"] }}
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="hideModal('profile-modal')">{{ t["btn.cancel"] }}</button>
      <button class="btn btn-primary" onclick="saveProfile()">{{ t["btn.save"] }}</button>
    </div>
  </div>
</div>
{{ m.custom_rule_modal() }}
{{ m.host_modal() }}

{% endblock %}

{% block scripts %}
<script src="/static/js/rules-common.js"></script>
<script src="/static/js/profiles.js" defer></script>
{% endblock %}
